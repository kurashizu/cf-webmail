<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KRSZ Mail — glossy envelope, teal">
  <defs>
    <!-- Background: project bg-primary with subtle teal-tinted vignette -->
    <radialGradient id="bg" cx="50%" cy="38%" r="82%">
      <stop offset="0%" stop-color="#0e1820"/>
      <stop offset="100%" stop-color="#04080a"/>
    </radialGradient>

    <!-- Envelope body: teal-tinted top-lit gradient (project accent #4fd3b2 in the middle) -->
    <linearGradient id="envBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8f0dc"/>
      <stop offset="28%" stop-color="#4fd3b2"/>
      <stop offset="100%" stop-color="#0a2e26"/>
    </linearGradient>

    <!-- Top rim highlight: bright teal-white edge -->
    <linearGradient id="topRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8fff8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#c8f0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c8f0e0" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom inner shadow -->
    <linearGradient id="bottomShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>

    <clipPath id="envClip">
      <rect x="44" y="36" width="168" height="144" rx="18"/>
    </clipPath>

    <filter id="textGlow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Envelope body (glossy teal gradient) -->
  <rect x="44" y="36" width="168" height="144" rx="18" fill="url(#envBody)"/>

  <!-- Inner bottom shadow -->
  <g clip-path="url(#envClip)">
    <rect x="44" y="148" width="168" height="32" fill="url(#bottomShade)"/>
  </g>

  <!-- V flap seam -->
  <g clip-path="url(#envClip)">
    <line x1="36" y1="36" x2="128" y2="120" stroke="#020a08" stroke-width="3" opacity="0.6"/>
    <line x1="220" y1="36" x2="128" y2="120" stroke="#020a08" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Top rim highlight (clipped) -->
  <g clip-path="url(#envClip)">
    <rect x="44" y="36" width="168" height="22" fill="url(#topRim)"/>
  </g>

  <!-- KRSZ text — glow layer (teal) -->
  <text x="128" y="228"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-2"
        fill="#4fd3b2" text-anchor="middle" opacity="0.75" filter="url(#textGlow)">KRSZ</text>

  <!-- KRSZ text — main (text-primary color) -->
  <text x="128" y="228"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-2"
        fill="#e8f0f8" text-anchor="middle">KRSZ</text>
</svg>